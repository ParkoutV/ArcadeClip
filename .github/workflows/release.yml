name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/updates.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag does not match app version $version."
          }
      - uses: actions/cache@v6
        with:
          path: build/arm64/downloads
          key: windows-inputs-${{ matrix.arch }}-${{ hashFiles('uv.lock', 'run/windows.inputs.lock.json') }}
      - name: Build native payload and collect notices
        run: python run/build_windows_portable.py --arch ${{ matrix.arch }}
      - name: Validate native binaries
        run: python run/validate_bundle.py dist/ArcadeClip-${{ matrix.arch }} --arch ${{ matrix.arch }}
      - name: Run regression tests
        shell: pwsh
        run: |
          $env:PATH = "$pwd/dist/ArcadeClip-${{ matrix.arch }}/tools;" + $env:PATH
          & "./dist/ArcadeClip-${{ matrix.arch }}/runtime/python.exe" -X utf8 run/run_tests.py --no-display
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
      - name: Exercise packaged media and OCR
        run: ./dist/ArcadeClip-${{ matrix.arch }}/runtime/python.exe -X utf8 run/verify_windows.py --bundle dist/ArcadeClip-${{ matrix.arch }} --ocr
      - uses: actions/upload-artifact@v7
        with:
          name: payload-${{ matrix.arch }}
          path: dist/ArcadeClip-${{ matrix.arch }}/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: installer-probe
          path: build/installer-tools/runtime-probe.exe

  installer:
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: payload-amd64
          path: dist/ArcadeClip-amd64
      - uses: actions/download-artifact@v8
        with:
          name: payload-arm64
          path: dist/ArcadeClip-arm64
      - uses: actions/download-artifact@v8
        with:
          name: installer-probe
          path: build/installer-tools
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $path = "$pwd/build/installer-tools/innosetup.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $path
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Compiler checksum mismatch.' }
          $process = Start-Process $path -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$pwd/build/installer-tools/inno" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
      - name: Compile universal installer
        run: ./run/build_user_installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ArcadeClip-windows-universal-installer
          path: |
            dist/installers/*-windows-universal-user-setup.exe
            dist/installers/*-windows-universal-user-setup.exe.sha256
          compression-level: 0
          retention-days: 14
      - name: Create draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/installers/*-windows-universal-user-setup.exe
            dist/installers/*-windows-universal-user-setup.exe.sha256
          body: |
            AMD64/ARM64 통합 설치 파일입니다. Windows 아키텍처를 자동으로 인식합니다.
            설치 중 Python 및 FFmpeg를 내장하거나 호환되는 PATH 설치를 선택할 수 있습니다.
            Windows 10/11 AMD64, Windows 11 ARM64를 지원합니다.

            Universal installer with native architecture detection and independent local/bundled
            Python and FFmpeg choices. The isolated x64 OCR runtime is always included.
            Original application source: MIT. Combined binary distribution: GPLv3.
            See bundled LICENSE, DISTRIBUTION.md, COPYING.GPLv3 and SOURCE-INFO.md.
            Before publishing this draft, provide the complete Corresponding Source required
            by all included GPL/LGPL components, including the PyAV/Qt/OpenCV FFmpeg builds.
            Source: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
